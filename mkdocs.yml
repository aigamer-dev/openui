site_name: OpenUI Documentation
site_description: The OpenAPI for Large Action Models (LAM)
site_author: aigamer-dev
site_url: https://aigamer-dev.github.io/openui/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Learn:
      - What is OpenUI?: index.md
      - OpenUI CLI: learn/cli.md
      - Benchmarks: learn/benchmarks.md
  - The Standard:
      - Protocol Overview: standards/protocol.md
      - Agent-UI Schema: standards/agent-ui.md
  - Usage: usage.md
  - Community:
      - Contributing: CONTRIBUTING.md
      - Development Guide: DEVELOPMENT.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
